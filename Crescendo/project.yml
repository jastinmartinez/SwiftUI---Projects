name: Crescendo

options:
  defaultSourceDirectoryType: syncedFolder
  deploymentTarget:
    iOS: "18.0"
  minimumXcodeGenVersion: 2.46.0

attributes:
  LastUpgradeCheck: "2660"

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    exactVersion: 1.26.0

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "6.0"

targets:
  Crescendo:
    type: application
    platform: iOS
    sources:
      - path: Crescendo
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
    info:
      path: Crescendo/Info.plist
      properties:
        JamendoClientID: $(JAMENDO_CLIENT_ID)
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
    settings:
      base:
        DEVELOPMENT_TEAM: WQNY636DWS
        PRODUCT_BUNDLE_IDENTIFIER: com.jastin.crescendo

  CrescendoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrescendoTests
    dependencies:
      - target: Crescendo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jastin.CrescendoTests

schemes:
  Crescendo:
    build:
      targets:
        Crescendo: all
        CrescendoTests: [test]
    test:
      targets:
        - name: CrescendoTests
          randomExecutionOrder: true
